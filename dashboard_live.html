<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Опрос новичков ВВ — дашборд</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══ НАСТРОЙКА: вставьте ваш ID таблицы Google Sheets ══ */
/* Это делается один раз в переменной SHEET_ID ниже в <script> */

:root {
  --bg: #f5f2ed; --surface: #ffffff; --surface2: #faf8f5;
  --border: #e2ddd6; --text: #1a1714; --muted: #7a7570;
  --p0: #d4380d; --p0-bg: #fff1ec; --p0-border: #ffcab7;
  --p1: #c07f00; --p1-bg: #fffbe6; --p1-border: #ffe07a;
  --p2: #2e7d32; --p2-bg: #edf7ee; --p2-border: #b2dfb4;
  --forced: #5b3fc9; --forced-bg: #f0ecff; --forced-border: #c9b8f7;
  --out: #555; --out-bg: #f0f0f0; --out-border: #d0d0d0;
  --green: #2e7d32; --green-bg: #edf7ee; --green-border: #b2dfb4;
  --yellow-warn: #b45309; --yellow-bg: #fffbe6; --yellow-border: #fde68a;
  --red: #c0392b; --red-bg: #fff1ec; --red-border: #ffcab7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Golos Text', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 60px; }

/* LOADER */
#loader { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; }
#loader svg { animation: spin 1s linear infinite; margin-bottom:16px; }
@keyframes spin { to { transform:rotate(360deg); } }
#loader p { font-family:'Unbounded',sans-serif; font-size:12px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
#loader.hidden { display:none; }

/* HEADER */
.header { background: var(--text); color: #f5f2ed; padding: 36px 48px 28px; position: relative; overflow: hidden; }
.header::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:20px; background:var(--bg); clip-path:ellipse(55% 100% at 50% 100%); }
.header-meta { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#a09890; margin-bottom:10px; font-family:'Unbounded',sans-serif; font-weight:400; }
.header h1 { font-family:'Unbounded',sans-serif; font-size:clamp(18px,2.6vw,28px); font-weight:800; line-height:1.15; letter-spacing:-.02em; margin-bottom:18px; }
.header h1 em { font-style:normal; color:#e8d44d; }
.header-stats { display:flex; gap:28px; flex-wrap:wrap; }
.stat { display:flex; flex-direction:column; gap:2px; }
.stat-value { font-family:'Unbounded',sans-serif; font-size:20px; font-weight:800; color:#fff; }
.stat-label { font-size:11px; color:#a09890; text-transform:uppercase; letter-spacing:.08em; }

/* WAVE SWITCHER */
.wave-bar { background:var(--surface2); border-bottom:2px solid var(--border); padding:12px 48px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.wave-label { font-family:'Unbounded',sans-serif; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:4px; }
.wave-btn { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600; padding:6px 14px; border:1.5px solid var(--border); background:var(--surface); border-radius:20px; cursor:pointer; color:var(--muted); transition:all .15s; }
.wave-btn:hover { border-color:#c8c2b8; color:var(--text); }
.wave-btn.active { background:var(--text); color:#fff; border-color:var(--text); }

/* TABS */
.tabs-bar { background:var(--surface); border-bottom:2px solid var(--border); padding:0 48px; display:flex; gap:0; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.tab-btn { font-family:'Unbounded',sans-serif; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:16px 20px 14px; border:none; background:none; cursor:pointer; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s,border-color .15s; white-space:nowrap; display:flex; align-items:center; gap:7px; }
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--text); border-bottom-color:var(--text); }
.tab-icon { font-size:14px; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* LEGEND */
.legend-bar { display:flex; gap:8px; flex-wrap:wrap; padding:16px 48px; border-bottom:1px solid var(--border); background:var(--surface2); }
.leg { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px 4px 8px; border-radius:20px; border:1.5px solid; }
.leg-p0 { color:var(--p0); background:var(--p0-bg); border-color:var(--p0-border); }
.leg-p1 { color:var(--p1); background:var(--p1-bg); border-color:var(--p1-border); }
.leg-p2 { color:var(--p2); background:var(--p2-bg); border-color:var(--p2-border); }
.leg-f  { color:var(--forced); background:var(--forced-bg); border-color:var(--forced-border); }
.leg-out{ color:var(--out); background:var(--out-bg); border-color:var(--out-border); }
.leg-dot { width:8px; height:8px; border-radius:50%; background:currentColor; }

/* MAIN */
.main { padding:32px 48px; max-width:1400px; }
.section-title { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border); }

/* PRIORITY GRID */
.priority-columns { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:32px; }
.priority-col-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.priority-badge { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:800; padding:4px 12px; border-radius:6px; border:2px solid; }
.badge-p0 { color:var(--p0); background:var(--p0-bg); border-color:var(--p0); }
.badge-p1 { color:var(--p1); background:var(--p1-bg); border-color:var(--p1); }
.badge-p2 { color:var(--p2); background:var(--p2-bg); border-color:var(--p2); }
.priority-col-desc { font-size:12px; color:var(--muted); font-style:italic; }
.theme-card { background:var(--surface); border-radius:12px; border:1.5px solid var(--border); padding:16px 18px; margin-bottom:12px; transition:box-shadow .15s,border-color .15s; }
.theme-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.07); border-color:#c8c2b8; }
.theme-card.p0 { border-left:4px solid var(--p0); }
.theme-card.p1 { border-left:4px solid var(--p1); }
.theme-card.p2 { border-left:4px solid var(--p2); }
.theme-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
.theme-name { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:600; line-height:1.3; }
.theme-count { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:800; white-space:nowrap; flex-shrink:0; }
.theme-count span { font-size:10px; font-weight:400; color:var(--muted); font-family:'Golos Text',sans-serif; }
.theme-tag { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-family:'Unbounded',sans-serif; }
.theme-desc { font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:10px; }
.theme-hypothesis { font-size:12px; background:var(--surface2); border-left:3px solid var(--border); padding:8px 10px; border-radius:0 6px 6px 0; color:#555; line-height:1.5; }
.theme-hypothesis strong { color:var(--text); font-weight:600; }
.bar-wrap { margin:6px 0 10px; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; }
.fill-p0 { background:var(--p0); } .fill-p1 { background:var(--p1); } .fill-p2 { background:var(--p2); }

/* FORCED */
.forced-section { margin-bottom:32px; }
.forced-items { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.forced-item { background:var(--forced-bg); border:1px solid var(--forced-border); border-radius:8px; padding:10px 14px; display:flex; align-items:flex-start; gap:10px; }
.forced-rank { font-family:'Unbounded',sans-serif; font-size:16px; font-weight:800; color:var(--forced); flex-shrink:0; line-height:1; padding-top:1px; }
.forced-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; }
.forced-mentions { font-size:11px; color:var(--forced); font-weight:600; }
.forced-quotes { margin-top:4px; font-size:11px; color:var(--muted); font-style:italic; line-height:1.4; }

/* OUT */
.out-section { margin-bottom:32px; }
.out-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.out-card { background:var(--surface); border:1.5px solid var(--out-border); border-left:4px solid #aaa; border-radius:8px; padding:14px 16px; }
.out-card-name { font-family:'Unbounded',sans-serif; font-size:12px; font-weight:600; color:var(--out); margin-bottom:4px; }
.out-card-tag { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#aaa; margin-bottom:6px; font-family:'Unbounded',sans-serif; }
.out-card-desc { font-size:12px; color:var(--muted); line-height:1.5; }
.out-card-note { margin-top:8px; font-size:11px; background:var(--out-bg); padding:6px 8px; border-radius:4px; color:#666; }

/* QUOTES */
.quotes-section { margin-bottom:32px; }
.quotes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.quote-card { background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:14px 16px 12px; position:relative; }
.quote-card::before { content:'"'; position:absolute; top:8px; left:12px; font-size:40px; line-height:1; color:var(--border); font-family:Georgia,serif; }
.quote-text { font-size:13px; line-height:1.55; color:var(--text); padding-top:16px; padding-left:4px; }
.quote-tag { display:inline-block; margin-top:10px; font-size:10px; font-family:'Unbounded',sans-serif; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:20px; border:1px solid; }
.quote-tag.p0 { color:var(--p0); border-color:var(--p0-border); background:var(--p0-bg); }
.quote-tag.p1 { color:var(--p1); border-color:var(--p1-border); background:var(--p1-bg); }
.quote-tag.p2 { color:var(--p2); border-color:var(--p2-border); background:var(--p2-bg); }
.quote-tag.forced { color:var(--forced); border-color:var(--forced-border); background:var(--forced-bg); }

/* RECOMMENDATION TAB */
.rec-main { padding:32px 48px; max-width:860px; }
.explainer { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:22px 24px; margin-bottom:24px; }
.explainer-title { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
.explainer-body { font-size:14px; line-height:1.7; }
.formula-row { display:flex; align-items:center; gap:10px; margin:16px 0 4px; flex-wrap:wrap; }
.formula-box { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; padding:8px 14px; border-radius:8px; border:2px solid; }
.formula-box.green { color:var(--green); background:var(--green-bg); border-color:var(--green-border); }
.formula-box.red   { color:var(--red);   background:var(--red-bg);   border-color:var(--red-border); }
.formula-box.result { color:var(--text); background:#f0f0f0; border-color:#ccc; }
.formula-op { font-size:20px; font-weight:600; color:var(--muted); }
.score-section { display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:start; margin-bottom:24px; }
.score-block { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:24px 28px; text-align:center; min-width:160px; }
.score-label { font-family:'Unbounded',sans-serif; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.score-number { font-family:'Unbounded',sans-serif; font-size:64px; font-weight:800; line-height:1; margin-bottom:4px; }
.score-verdict { font-size:12px; font-weight:600; margin-bottom:8px; }
.score-period { font-size:11px; color:var(--muted); }
.breakdown { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:20px 22px; }
.breakdown-title { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
.brow { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.brow-label { width:100px; font-size:13px; font-weight:600; flex-shrink:0; line-height:1.2; }
.brow-label.stons { color:var(--green); } .brow-label.neuts { color:var(--yellow-warn); }
.brow-label.crits { color:var(--red); } .brow-label.noanswer { color:var(--muted); }
.brow-bar-wrap { flex:1; height:12px; background:var(--border); border-radius:6px; overflow:hidden; }
.brow-fill { height:100%; border-radius:6px; }
.fill-green { background:var(--green); } .fill-yellow { background:#d97706; }
.fill-red { background:var(--red); } .fill-grey { background:#bbb; }
.brow-pct { width:36px; font-family:'Unbounded',sans-serif; font-size:12px; font-weight:700; text-align:right; flex-shrink:0; }
.brow-n { width:50px; font-size:11px; color:var(--muted); text-align:right; flex-shrink:0; }
.bench-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:24px; }
.bench-card { background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:14px 16px; text-align:center; }
.bench-val { font-family:'Unbounded',sans-serif; font-size:20px; font-weight:800; margin-bottom:4px; color:var(--muted); }
.bench-label { font-size:11px; color:var(--muted); line-height:1.4; }
.bench-card.active { border-color:var(--green); background:var(--green-bg); }
.bench-card.active .bench-val { color:var(--green); }
.warning-box { background:#fef3c7; border:1.5px solid #fcd34d; border-radius:10px; padding:16px 18px; margin-bottom:24px; display:flex; gap:12px; align-items:flex-start; }
.warn-icon { font-size:20px; flex-shrink:0; margin-top:1px; }
.warn-text { font-size:13px; line-height:1.6; color:#92400e; }

/* TREND CHART */
.trend-section { margin-bottom:24px; }
.trend-chart { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:20px 24px; }
.trend-bars { display:flex; align-items:flex-end; gap:16px; height:120px; margin-top:12px; }
.trend-bar-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
.trend-bar { width:100%; border-radius:4px 4px 0 0; transition:height .4s ease; min-height:4px; }
.trend-bar-label { font-family:'Unbounded',sans-serif; font-size:9px; color:var(--muted); text-align:center; }
.trend-bar-val { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:700; }

/* ERROR */
.error-box { margin:40px 48px; background:#fff1ec; border:1.5px solid #ffcab7; border-radius:12px; padding:24px; }
.error-box h3 { font-family:'Unbounded',sans-serif; font-size:13px; color:#d4380d; margin-bottom:8px; }
.error-box p { font-size:13px; color:#7a7570; line-height:1.6; }
.error-box code { background:#f5f2ed; padding:2px 6px; border-radius:4px; font-family:monospace; font-size:12px; }

@media (max-width:900px) {
  .header { padding:28px 24px 22px; }
  .tabs-bar { padding:0 16px; overflow-x:auto; }
  .wave-bar { padding:10px 16px; }
  .legend-bar { padding:14px 24px; }
  .main,.rec-main { padding:20px 24px; }
  .priority-columns { grid-template-columns:1fr; }
  .score-section { grid-template-columns:1fr; }
  .bench-row { grid-template-columns:1fr; }
}
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.theme-card,.forced-item,.quote-card,.out-card,.bench-card { animation:fadeUp .3s ease both; }
</style>
</head>

<!-- CONTENT (скрыт до загрузки) -->
<div id="app" style="display:none">

  <div class="header">
    <div class="header-meta" id="hdr-meta">ВкусВилл · Курьерский опыт</div>
    <h1>Опрос новичков-курьеров:<br><em>приоритеты для продуктовой команды</em></h1>

      <div class="stat"><span class="stat-value" id="hdr-responses">—</span><span class="stat-label">ответов</span></div>

<script>
// ══════════════════════════════════════════════════════════
// 🔧 НАСТРОЙКА: вставьте ID вашей Google Таблицы сюда
// Найдите его в URL: docs.google.com/spreadsheets/d/ВОТ_ЭТО/edit
// ══════════════════════════════════════════════════════════
const SHEET_ID = "ВСТАВЬТЕ_ID_ТАБЛИЦЫ_СЮДА";
// ══════════════════════════════════════════════════════════

const GID = {
  waves:  "0",          // gid листа "waves" (обычно 0)
  themes: "1",          // gid листа "themes"
  quotes: "2",          // gid листа "quotes"
};

// После публикации таблицы gid'ы можно найти в URL каждой вкладки.
// Если листы переименовывались, обновите GID выше.

function csvUrl(gid) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') { inQ = !inQ; continue; }
    if (ch === ',' && !inQ) { row.push(cell.trim()); cell = ''; continue; }
    if ((ch === '\n' || ch === '\r') && !inQ) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell.trim()); rows.push(row); row = []; cell = '';
      continue;
    }
    cell += ch;
  }
  if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows;
}

function csvToObjects(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r => r.some(c => c)).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (r[i] || '').trim());
    return obj;
  });
}

async function fetchSheet(gid) {
  const r = await fetch(csvUrl(gid));
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return csvToObjects(await r.text());
}

// ── State ──
let waves = [], themes = [], quotes = [];
let currentWave = null;

async function init() {
  if (SHEET_ID === "ВСТАВЬТЕ_ID_ТАБЛИЦЫ_СЮДА") {
    showError("Таблица не подключена",
      `Откройте файл <code>dashboard.html</code> в текстовом редакторе и замените значение 
      <code>ВСТАВЬТЕ_ID_ТАБЛИЦЫ_СЮДА</code> на ID вашей Google Таблицы.<br><br>
      ID находится в URL таблицы: <code>docs.google.com/spreadsheets/d/<b>ВОТ_ЭТО</b>/edit</code>`);
    return;
  }
  try {
    [waves, themes, quotes] = await Promise.all([
      fetchSheet(GID.waves),
      fetchSheet(GID.themes),
      fetchSheet(GID.quotes),
    ]);
    if (!waves.length) throw new Error("Лист waves пустой");
    currentWave = waves[waves.length - 1].wave_id; // последняя волна по умолчанию
    buildWaveSwitcher();
    render();
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('app').style.display = '';
  } catch(e) {
    showError("Ошибка загрузки данных",
      `Не удалось загрузить данные из Google Sheets.<br><br>
      Убедитесь что:<br>
      1. Таблица открыта для просмотра всем по ссылке<br>
      2. ID таблицы в коде указан верно<br>
      3. Названия листов: <code>waves</code>, <code>themes</code>, <code>quotes</code><br><br>
      Ошибка: <code>${e.message}</code>`);
  }
}

function showError(title, html) {
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('app').style.display = '';
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <h3>⚠️ ${title}</h3>
      <p>${html}</p>
    </div>`;
}

function buildWaveSwitcher() {
  const bar = document.getElementById('wave-bar');
  bar.innerHTML = '<span class="wave-label">Волна:</span>';
  waves.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'wave-btn' + (w.wave_id === currentWave ? ' active' : '');
    btn.textContent = w.period;
    btn.onclick = () => { currentWave = w.wave_id; buildWaveSwitcher(); render(); };
    bar.appendChild(btn);
  });
  if (waves.length < 2) bar.style.display = 'none'; // скрыть если одна волна
}

function render() {
  const wave = waves.find(w => w.wave_id === currentWave);
  if (!wave) return;
  const wThemes = themes.filter(t => t.wave_id === currentWave);
  const wQuotes = quotes.filter(q => q.wave_id === currentWave);

  // Header
  const total = parseInt(wave.total_responses) || 0;
  const tagCount = [...new Set(wThemes.filter(t=>t.type==='theme').map(t=>t.tag))].length;
  document.getElementById('hdr-meta').textContent = `ВкусВилл · Курьерский опыт · Волна ${wave.period}`;
  document.getElementById('hdr-responses').textContent = total;
  document.getElementById('hdr-period').textContent = wave.period.split(' ')[0];
  document.getElementById('hdr-tags').textContent = tagCount || wThemes.filter(t=>t.type==='theme').length;

  renderPriorities(wave, wThemes, wQuotes);
  renderRec(wave);
}

function pct(n, total) {
  if (!total) return 0;
  return Math.round(n / total * 100);
}

function scoreColor(score) {
  const s = parseInt(score);
  if (s >= 50) return 'var(--green)';
  if (s >= 20) return 'var(--p1)';
  return 'var(--p0)';
}

function scoreVerdict(score) {
  const s = parseInt(score);
  if (s >= 50) return 'Отличный результат';
  if (s >= 30) return 'Хороший результат';
  if (s >= 0)  return 'Удовлетворительно';
  return 'Требует внимания';
}

function renderPriorities(wave, wThemes, wQuotes) {
  const total = parseInt(wave.total_responses) || 1;
  const forcedResp = parseInt(wave.forced_responses) || 0;

  const p0 = wThemes.filter(t=>t.type==='theme'&&t.priority==='P0');
  const p1 = wThemes.filter(t=>t.type==='theme'&&t.priority==='P1');
  const p2 = wThemes.filter(t=>t.type==='theme'&&t.priority==='P2');
  const forced = wThemes.filter(t=>t.type==='forced').sort((a,b)=>parseInt(a.forced_rank)-parseInt(b.forced_rank));
  const out = wThemes.filter(t=>t.type==='out');

  let html = '';

  // FORCED CHOICE
  if (forced.length) {
    html += `
    <div class="forced-section">
      <div class="section-title">Forced choice — «одна мелочь, которая больше всего улучшит старт»</div>
      <div style="background:var(--forced);color:#fff;border-radius:10px 10px 0 0;padding:14px 20px;">
        <div style="font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;">🎯 Что люди называют главным, когда их вынуждают выбрать одно</div>
        <div style="font-size:12px;opacity:.75;margin-top:4px;">Самый чистый сигнал приоритета. ${forcedResp ? forcedResp + ' ответов.' : ''}</div>
      </div>
      <div style="background:var(--surface);border:1.5px solid var(--forced-border);border-top:none;border-radius:0 0 10px 10px;padding:18px 20px;">
        <div class="forced-items">
          ${forced.map(f=>`
          <div class="forced-item">
            <div class="forced-rank">${f.forced_rank}</div>
            <div>
              <div class="forced-title">${f.title}</div>
              <div class="forced-mentions">${f.count ? '~'+f.count+' упоминаний' : ''}</div>
              <div class="forced-quotes">${[f.forced_quote_1, f.forced_quote_2].filter(Boolean).map(q=>'«'+q+'»').join(' · ')}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  // PRIORITY COLUMNS
  html += `<div class="section-title">Приоритизация тем для продуктовой команды</div>`;

  function themeCards(list, pClass, fillClass) {
    if (!list.length) return '<p style="font-size:13px;color:var(--muted);font-style:italic;padding:8px 0">Тем нет</p>';
    const maxCount = Math.max(...list.map(t=>parseInt(t.count)||0));
    return list.map(t => {
      const count = parseInt(t.count) || 0;
      const barPct = maxCount ? Math.round(count/maxCount*100) : 0;
      return `
      <div class="theme-card ${pClass}">
        <div class="theme-tag">${t.tag}</div>
        <div class="theme-top">
          <div class="theme-name">${t.title}</div>
          <div class="theme-count">${count}<span> чел.</span></div>
        </div>
        <div class="bar-wrap"><div class="bar-fill ${fillClass}" style="width:${barPct}%"></div></div>
        <div class="theme-desc">${t.description}</div>
        ${t.hypothesis ? `<div class="theme-hypothesis"><strong>Гипотеза:</strong> ${t.hypothesis}</div>` : ''}
      </div>`;
    }).join('');
  }

  html += `
  <div class="priority-columns">
    <div>
      <div class="priority-col-header">
        <div class="priority-badge badge-p0">P0</div>
        <div class="priority-col-desc">Блокеры старта — решать сейчас</div>
      </div>
      ${themeCards(p0,'p0','fill-p0')}
    </div>
    <div>
      <div class="priority-col-header">
        <div class="priority-badge badge-p1">P1</div>
        <div class="priority-col-desc">Серьёзная боль — в ближайший бэклог</div>
      </div>
      ${themeCards(p1,'p1','fill-p1')}
    </div>
    <div>
      <div class="priority-col-header">
        <div class="priority-badge badge-p2">P2</div>
        <div class="priority-col-desc">Улучшение — планировать</div>
      </div>
      ${themeCards(p2,'p2','fill-p2')}
    </div>
  </div>`;

  // OUT OF SCOPE
  if (out.length) {
    html += `
    <div class="out-section">
      <div class="section-title">Вне продуктового скоупа — передать в смежные треки</div>
      <div class="out-row">
        ${out.map(t=>`
        <div class="out-card">
          <div class="out-card-tag">${t.tag}</div>
          <div class="out-card-name">${t.title}</div>
          <div class="out-card-desc">${t.description}</div>
          ${t.owner ? `<div class="out-card-note">→ <strong>${t.owner}</strong>${t.hypothesis ? ' · '+t.hypothesis : ''}</div>` : ''}
        </div>`).join('')}
      </div>
    </div>`;
  }

  // QUOTES
  if (wQuotes.length) {
    const priorityClass = p => {
      if (p==='P0'||p==='p0') return 'p0';
      if (p==='P1'||p==='p1') return 'p1';
      if (p==='P2'||p==='p2') return 'p2';
      return 'forced';
    };
    html += `
    <div class="quotes-section">
      <div class="section-title">Голоса — цитаты для контекста</div>
      <div class="quotes-grid">
        ${wQuotes.map(q=>`
        <div class="quote-card">
          <div class="quote-text">${q.text}</div>
          <span class="quote-tag ${priorityClass(q.priority)}">${q.tag} · ${q.priority}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('priorities-content').innerHTML = html;
}

function renderRec(wave) {
  const total = parseInt(wave.total_responses) || 0;
  const promoters = parseInt(wave.promoters) || 0;
  const neutrals = parseInt(wave.neutrals) || 0;
  const critics = parseInt(wave.critics) || 0;
  const noAnswer = parseInt(wave.no_answer) || 0;
  const score = parseInt(wave.score) || 0;

  const pProm = pct(promoters, total);
  const pNeut = pct(neutrals, total);
  const pCrit = pct(critics, total);
  const pNo   = pct(noAnswer, total);

  const color = scoreColor(score);
  const verdict = scoreVerdict(score);

  // История волн для тренда
  const waveHistory = waves.map(w => ({
    period: w.period,
    score: parseInt(w.score) || 0,
    id: w.wave_id
  }));
  const maxScore = Math.max(...waveHistory.map(w => Math.abs(w.score)), 10);

  const trendBars = waveHistory.map(w => {
    const h = Math.max(4, Math.round(Math.abs(w.score) / maxScore * 90));
    const c = w.id === currentWave ? scoreColor(w.score) : '#c8c2b8';
    return `
    <div class="trend-bar-wrap">
      <div class="trend-bar-val" style="color:${c}">${w.score>0?'+':''}${w.score}</div>
      <div class="trend-bar" style="height:${h}px;background:${c}"></div>
      <div class="trend-bar-label">${w.period.replace(' ', '\n')}</div>
    </div>`;
  }).join('');

  let html = `
  <div style="padding-top:28px">
    <div class="section-title" style="margin-bottom:20px">Готовность рекомендовать работу другу · ${wave.period}</div>
    <p style="font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;">${total} ответов · вопрос: «Порекомендуешь нас другу после первой недели?»</p>
  </div>

  <div class="explainer">
    <div class="explainer-title">Что это за показатель</div>
    <div class="explainer-body">
      Это <strong>показатель готовности рекомендовать</strong> — адаптированный под сотрудников. Все ответы делятся на три группы: <strong>сторонники</strong>, <strong>нейтральные</strong> и <strong>критики</strong>. Итоговое число:
    </div>
    <div class="formula-row">
      <div class="formula-box green">% сторонников</div>
      <div class="formula-op">−</div>
      <div class="formula-box red">% критиков</div>
      <div class="formula-op">=</div>
      <div class="formula-box result">итог</div>
    </div>
  </div>

  <div class="score-section">
    <div class="score-block">
      <div class="score-label">Показатель<br>готовности</div>
      <div class="score-number" style="color:${color}">${score>0?'+':''}${score}</div>
      <div class="score-verdict" style="color:${color}">${verdict}</div>
      <div class="score-period">${wave.period}</div>
    </div>
    <div class="breakdown">
      <div class="breakdown-title">Из чего сложилось</div>
      <div class="brow">
        <div class="brow-label stons">Сторонники</div>
        <div class="brow-bar-wrap"><div class="brow-fill fill-green" style="width:${pProm}%"></div></div>
        <div class="brow-pct" style="color:var(--green)">${pProm}%</div>
        <div class="brow-n">~${promoters} чел.</div>
      </div>
      <div class="brow">
        <div class="brow-label neuts">Нейтральные</div>
        <div class="brow-bar-wrap"><div class="brow-fill fill-yellow" style="width:${pNeut}%"></div></div>
        <div class="brow-pct" style="color:#d97706">${pNeut}%</div>
        <div class="brow-n">~${neutrals} чел.</div>
      </div>
      <div class="brow">
        <div class="brow-label crits">Критики</div>
        <div class="brow-bar-wrap"><div class="brow-fill fill-red" style="width:${pCrit}%"></div></div>
        <div class="brow-pct" style="color:var(--red)">${pCrit}%</div>
        <div class="brow-n">~${critics} чел.</div>
      </div>
      <div class="brow">
        <div class="brow-label noanswer">Не ответили</div>
        <div class="brow-bar-wrap"><div class="brow-fill fill-grey" style="width:${pNo}%"></div></div>
        <div class="brow-pct" style="color:var(--muted)">${pNo}%</div>
        <div class="brow-n">~${noAnswer} чел.</div>
      </div>
    </div>
  </div>`;

  // Тренд (только если > 1 волны)
  if (waveHistory.length > 1) {
    html += `
  <div class="trend-section">
    <div class="trend-chart">
      <div class="breakdown-title">Динамика по волнам</div>
      <div class="trend-bars">${trendBars}</div>
    </div>
  </div>`;
  }

  html += `
  <div class="bench-row">
    <div class="bench-card">
      <div class="bench-val">0</div>
      <div class="bench-label">Нижняя граница нормы для доставки</div>
    </div>
    <div class="bench-card active">
      <div class="bench-val">${score>0?'+':''}${score}</div>
      <div class="bench-label">Наш показатель<br>${wave.period}</div>
    </div>
    <div class="bench-card">
      <div class="bench-val">+50–60</div>
      <div class="bench-label">Ориентир для устойчивого «сарафанного радио»</div>
    </div>
  </div>`;

  document.getElementById('rec-content').innerHTML = html;
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

init();
</script>
</body>
</html>
