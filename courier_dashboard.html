<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд: опрос новичков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f2ed; --surface: #ffffff; --border: #e8e3db; --border-light: #f0ece5;
    --text: #1a1714; --text-muted: #7a7570; --text-faint: #b0aaa3;
    --red: #d4380d; --red-bg: #fff1ec;
    --amber: #c07f00; --amber-bg: #fffbe6;
    --green: #2e7d32; --green-bg: #e8f5e9;
    --purple: #5b3fc9; --purple-bg: #f0ecff;
    --r: 12px; --font: 'Onest', sans-serif; --mono: 'Martian Mono', monospace;
  }
  html { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

  /* NAV */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,242,237,0.93); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 4px;
    padding: 0 20px; height: 52px; overflow-x: auto;
  }
  .nav-logo { font-weight: 700; font-size: 13px; margin-right: 12px; white-space: nowrap; flex-shrink: 0; }
  .nav-tab {
    padding: 6px 13px; border-radius: 8px; border: none; background: none;
    font-family: var(--font); font-size: 13px; font-weight: 500;
    color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .nav-tab:hover { background: var(--border-light); color: var(--text); }
  .nav-tab.active { background: var(--text); color: #f5f2ed; }

  /* CONTENT */
  .content { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }

  /* PAGE HEADER */
  .page-header { margin-bottom: 28px; }
  .header-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 6px; margin-bottom: 8px;
  }
  .badge-current { background: var(--green-bg); color: var(--green); }
  .badge-past    { background: var(--border-light); color: var(--text-muted); }
  .badge-compare { background: var(--purple-bg); color: var(--purple); }
  .header-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 5px; }
  .header-meta  { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

  /* SECTION */
  .section { margin-bottom: 28px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); font-family: var(--mono); margin-bottom: 12px; }

  /* KPI */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
  .kpi-label { font-size: 11px; color: var(--text-muted); font-family: var(--mono); margin-bottom: 5px; letter-spacing: 0.03em; line-height: 1.3; }
  .kpi-value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .kpi-value.green { color: var(--green); }
  .kpi-value.amber { color: var(--amber); }
  .kpi-value.red   { color: var(--red); }
  .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-family: var(--mono); }

  /* INSIGHTS */
  .insight-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .insight-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: var(--r); padding: 14px; }
  .insight-card.danger  { border-left-color: var(--red); }
  .insight-card.positive{ border-left-color: var(--green); background: #fafff8; }
  .insight-card.warning { border-left-color: var(--amber); }
  .insight-card.action  { border-left-color: var(--purple); background: #faf8ff; }
  .insight-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
  .insight-text  { font-size: 12px; line-height: 1.5; }

  /* REC SCORE */
  .rec-block { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; }
  .rec-score-big { font-size: 52px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .rec-score-big.green { color: var(--green); }
  .rec-score-big.amber { color: var(--amber); }
  .rec-score-big.red   { color: var(--red); }
  .rec-note    { font-size: 13px; color: var(--text-muted); margin-top: 7px; max-width: 220px; line-height: 1.5; }
  .rec-formula { font-size: 10px; color: var(--text-faint); margin-top: 5px; font-family: var(--mono); }

  /* STACKED BAR */
  .stacked-bar { display: flex; height: 11px; border-radius: 6px; overflow: hidden; margin-bottom: 9px; }
  .stacked-seg { height: 100%; }
  .bar-legend  { display: flex; gap: 14px; flex-wrap: wrap; }
  .bar-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }
  .bar-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* PRIORITY BOARD */
  .priority-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 10px; }
  .priority-col  { border-radius: var(--r); border: 1px solid; padding: 12px; }
  .priority-col-title { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 9px; }
  .theme-card { background: var(--surface); border-radius: 8px; padding: 9px 11px; margin-bottom: 7px; border: 1px solid var(--border); }
  .theme-card:last-child { margin-bottom: 0; }
  .theme-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .theme-meta { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
  .trend-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-family: var(--mono); padding: 2px 6px; border-radius: 4px; margin-top: 4px; }
  .trend-up     { background: var(--green-bg); color: var(--green); }
  .trend-down   { background: var(--red-bg); color: var(--red); }
  .trend-stable { background: var(--border-light); color: var(--text-muted); }

  /* FC BARS */
  .fc-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
  .fc-row  { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .fc-row:last-child { margin-bottom: 0; }
  .fc-label { font-size: 12px; width: 195px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fc-track { flex: 1; height: 13px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
  .fc-fill  { height: 100%; border-radius: 4px; }
  .fc-count { font-size: 11px; width: 22px; text-align: right; color: var(--text-muted); font-family: var(--mono); }

  /* DRIVERS */
  .drivers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 10px; }
  .driver-card  { background: var(--surface); border: 1px solid #c8e6c9; border-radius: var(--r); padding: 13px; }
  .driver-name  { font-size: 13px; font-weight: 500; color: var(--green); margin-bottom: 3px; }
  .driver-meta  { font-size: 11px; font-family: var(--mono); color: var(--text-muted); margin-bottom: 5px; }
  .driver-why   { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

  /* PRIORITY BADGE */
  .priority-badge { display: inline-block; font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.1em; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; margin-bottom: 6px; }

  /* QUOTES */
  .quotes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; }
  .quote-card  { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
  .quote-mark  { font-size: 36px; line-height: 0.8; color: var(--border); float: left; margin-right: 6px; margin-top: 3px; font-weight: 700; }
  .quote-text  { font-size: 13px; line-height: 1.6; color: var(--text); margin-bottom: 9px; }
  .quote-theme { font-size: 11px; font-family: var(--mono); color: var(--text-muted); }

  /* INFO NOTE / LEGEND */
  .info-note { font-size: 12px; color: var(--text-muted); line-height: 1.5; background: var(--bg); border-radius: 8px; padding: 9px 13px; border: 1px solid var(--border); margin-bottom: 14px; }
  .priority-legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; background: var(--bg); border-radius: 8px; padding: 9px 13px; border: 1px solid var(--border); }
  .pl-label { font-size: 11px; color: var(--text-muted); font-family: var(--mono); margin-right: 4px; }
  .pl-item  { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .pl-badge { font-family: var(--mono); font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }

  /* COMPARISON */
  .comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
  .comp-card  { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
  .comp-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 11px; }
  .comp-values{ display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .comp-period{ font-size: 10px; color: var(--text-muted); margin-bottom: 2px; font-family: var(--mono); }
  .comp-num   { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .comp-arrow { font-size: 16px; color: var(--border); margin-bottom: 3px; align-self: center; }
  .comp-delta { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; align-self: center; }
  .delta-pos  { background: var(--green-bg); color: var(--green); }
  .delta-neg  { background: var(--red-bg); color: var(--red); }
  .delta-neu  { background: var(--border-light); color: var(--text-muted); }

  /* TABLE */
  .tbl-wrap { background: var(--surface); border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); overflow-x: auto; }
  table.tbl  { width: 100%; border-collapse: collapse; min-width: 560px; }
  .tbl th { background: var(--bg); padding: 8px 11px; text-align: left; font-size: 10px; font-family: var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .tbl td { padding: 9px 11px; font-size: 12px; border-bottom: 1px solid var(--border-light); vertical-align: top; line-height: 1.4; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: var(--bg); }
  .tag { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 4px; }

  /* LOADING / ERROR */
  #loading-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-family: var(--mono); font-size: 13px; color: var(--text-muted); z-index: 9999;
  }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--text-muted); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .content { padding: 16px 12px 60px; }
    .header-title { font-size: 20px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .rec-score-big { font-size: 38px; }
    .fc-label { width: 130px; }
  }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <span>Загрузка данных из Google Sheets…</span>
</div>

<nav class="nav">
  <div class="nav-logo">Опрос новичков</div>
  <div id="nav-tabs"></div>
</nav>

<div class="content" id="app"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
// Базовый URL публичной таблицы
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSfz9wDknaoTLqL0JvWX7wYC1fOyR8V1bMBahXn6HLciQUAAHfAIsKPJsAZMYTFTL0EIhO-VcXzwkmz/pub?output=csv";

// GID листов (из ссылок, предоставленных пользователем)
const SHEETS = {
  dashboard_config:      "1141675891",
  theme_summary:         "708904423",
  forced_choice:         "350437764",
  recommendation:        "1631580498",
  positive_drivers:      "1850068511",
  quotes:                "809660918",
  comparison_prev_period:"621821196",
};

function csvUrl(gid) { return `${SHEET_BASE}&gid=${gid}`; }

// ─── CSV PARSER ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = splitCSVRow(lines[0]);
  return lines.slice(1).map(line => {
    const vals = splitCSVRow(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] || "").trim(); });
    return obj;
  }).filter(r => Object.values(r).some(v => v !== ""));
}

function splitCSVRow(row) {
  const result = []; let cur = ""; let inQ = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ""; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

function num(v) { const n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? 0 : n; }

// ─── FETCH ALL SHEETS ─────────────────────────────────────────────────────────
async function fetchAll() {
  const entries = Object.entries(SHEETS);
  const results = await Promise.allSettled(
    entries.map(([name, gid]) =>
      fetch(csvUrl(gid)).then(r => r.text()).then(t => ({ name, rows: parseCSV(t) }))
    )
  );
  const data = {};
  results.forEach(r => {
    if (r.status === "fulfilled") data[r.value.name] = r.value.rows;
    else console.warn("Sheet fetch failed:", r.reason);
  });
  return data;
}

// ─── PERIOD LOGIC ─────────────────────────────────────────────────────────────
function parsePeriods(cfg) {
  const byPeriod = {};
  (cfg || []).forEach(row => {
    const pid = row.source_period;
    if (!pid) return;
    if (!byPeriod[pid]) byPeriod[pid] = { periodId: pid, periodLabel: pid };
    const key = (row.key || row.metric || "").trim();
    const val = (row.value || "").trim();
    if (key === "period")           byPeriod[pid].periodLabel   = val;
    if (key === "period_end" || key === "actual_last_response")   byPeriod[pid].periodEnd   = val;
    if (key === "period_start" || key === "actual_first_response") byPeriod[pid].periodStart = val;
    if (key === "total_responses")  byPeriod[pid].totalResponses = num(val);
    if (key === "recommendation_score") byPeriod[pid].recScore  = num(val);
  });
  return Object.values(byPeriod).sort((a,b) =>
    new Date(b.periodEnd || b.periodStart || "1900").getTime() -
    new Date(a.periodEnd || a.periodStart || "1900").getTime()
  );
}

function getConfig(cfg, pid, key) {
  const row = (cfg||[]).find(r => r.source_period === pid && ((r.key||"").trim() === key || (r.metric||"").trim() === key));
  return row ? num(row.value) : 0;
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const PRIORITY_COLORS = {
  "P0":                 { bg:"#fff1ec", text:"#d4380d" },
  "P0/P1":              { bg:"#fff1ec", text:"#d4380d" },
  "P1":                 { bg:"#fffbe6", text:"#c07f00" },
  "P1 / hidden P0":     { bg:"#fffbe6", text:"#c07f00" },
  "P1/P2":              { bg:"#fffbe6", text:"#c07f00" },
  "Out / P1":           { bg:"#fffbe6", text:"#c07f00" },
  "P2":                 { bg:"#f0f7f0", text:"#2e7d32" },
  "P2 / Ops":           { bg:"#f0f7f0", text:"#2e7d32" },
  "Positive":           { bg:"#e8f5e9", text:"#1b5e20" },
  "Positive / Control": { bg:"#e8f5e9", text:"#1b5e20" },
  "Control":            { bg:"#e8f5e9", text:"#1b5e20" },
  "Manual check":       { bg:"#f5f5f5", text:"#666" },
};
function getPrio(p) { return PRIORITY_COLORS[String(p||"").trim()] || { bg:"#f0ede8", text:"#7a7570" }; }

function wordForm(n) {
  const v = Math.abs(n) % 100, v1 = v % 10;
  if (v >= 11 && v <= 19) return "ответов";
  if (v1 === 1) return "ответ";
  if (v1 >= 2 && v1 <= 4) return "ответа";
  return "ответов";
}

function trendBadge(trend, delta) {
  if (!trend) return "";
  const cls   = trend === "усилилось" ? "trend-up" : trend === "ослабло" ? "trend-down" : "trend-stable";
  const arrow = trend === "усилилось" ? "↑" : trend === "ослабло" ? "↓" : "→";
  const dStr  = delta != null && delta !== "" ? ` ${num(delta) > 0 ? "+" : ""}${num(delta).toFixed(1)} pp` : " " + trend;
  return `<span class="trend-badge ${cls}">${arrow}${dStr}</span>`;
}

function prioBadge(p) {
  const s = getPrio(p);
  return `<span class="priority-badge" style="background:${s.bg};color:${s.text}">${p}</span>`;
}

function priorityLegend() {
  return `<div class="priority-legend">
    <span class="pl-label">Приоритеты:</span>
    <div class="pl-item"><span class="pl-badge" style="background:#fff1ec;color:#d4380d">P0</span>критично</div>
    <div class="pl-item"><span class="pl-badge" style="background:#fff1ec;color:#d4380d">P0/P1</span>критично или высокий</div>
    <div class="pl-item"><span class="pl-badge" style="background:#fffbe6;color:#c07f00">P1</span>высокий приоритет</div>
    <div class="pl-item"><span class="pl-badge" style="background:#f0f7f0;color:#2e7d32">P2</span>следим</div>
  </div>`;
}

// ─── RENDER PERIOD ────────────────────────────────────────────────────────────
function renderPeriod(period, isCurrent, DATA) {
  const pid = period.periodId;
  const cfg = DATA.dashboard_config || [];

  const totalResponses = period.totalResponses || getConfig(cfg, pid, "total_responses");
  const recScore       = period.recScore       || getConfig(cfg, pid, "recommendation_score");

  const recRows      = (DATA.recommendation || []).filter(r => r.source_period === pid);
  const promoterRow  = recRows.find(r => (r.group||"").trim() === "promoter") || {};
  const neutralRow   = recRows.find(r => (r.group||"").trim() === "neutral")  || {};
  const criticRow    = recRows.find(r => (r.group||"").trim() === "critic")   || {};

  const promotersN    = num(promoterRow.count    || getConfig(cfg, pid, "promoters_count"));
  const neutralsN     = num(neutralRow.count     || getConfig(cfg, pid, "neutrals_count"));
  const criticsN      = num(criticRow.count      || getConfig(cfg, pid, "critics_count"));
  const promoterShare = num(promoterRow.share_pct || getConfig(cfg, pid, "promoters_pct") || 0);
  const neutralShare  = num(neutralRow.share_pct  || getConfig(cfg, pid, "neutrals_pct")  || 0);
  const criticShare   = num(criticRow.share_pct   || getConfig(cfg, pid, "critics_pct")   || 0);

  // Normalize pct: if stored as 0.64 → multiply by 100
  const fixPct = v => v > 1 ? v : v * 100;
  const pShare = fixPct(promoterShare);
  const nShare = fixPct(neutralShare);
  const cShare = fixPct(criticShare);

  const themes  = (DATA.theme_summary  || []).filter(r => r.source_period === pid);
  const fcItems = (DATA.forced_choice  || []).filter(r => r.source_period === pid).sort((a,b) => num(b.mentions) - num(a.mentions));
  const drivers = (DATA.positive_drivers || []).filter(r => r.source_period === pid);
  const quotes  = (DATA.quotes         || []).filter(r => r.source_period === pid);

  const p0  = themes.filter(t => /^P0/.test(String(t.priority||"")) && !String(t.priority||"").includes("Positive"));
  const p1  = themes.filter(t => /^P1|^Out/.test(String(t.priority||"")));
  const p2  = themes.filter(t => /^P2/.test(String(t.priority||"")));
  const pos = themes.filter(t => String(t.priority||"").includes("Positive") || String(t.priority||"").trim() === "Control");

  const fcMax = Math.max(...fcItems.map(f => num(f.mentions)), 1);
  const scoreColor = recScore >= 50 ? "green" : recScore >= 20 ? "amber" : "red";
  const balance    = promotersN - criticsN;

  // Stacked bar segments
  const total = pShare + nShare + cShare;
  const pp = total > 0 ? (pShare/total)*100 : 0;
  const np = total > 0 ? (nShare/total)*100 : 0;
  const cp = total > 0 ? (cShare/total)*100 : 0;

  function renderCol(items, title, bg, border, color) {
    if (!items.length) return "";
    return `<div class="priority-col" style="background:${bg};border-color:${border}">
      <div class="priority-col-title" style="color:${color}">${title}</div>
      ${items.map(t => `<div class="theme-card">
        <div class="theme-name">${t.theme}</div>
        ${t.mentions ? `<div class="theme-meta">${t.mentions} упом. · ${t.share}%</div>` : ""}

// ─── RENDER COMPARISON ────────────────────────────────────────────────────────
function renderComparison(currentPeriod, prevPeriod, DATA) {
  if (!currentPeriod || !prevPeriod) return `<p style="padding:40px;text-align:center;color:var(--text-muted)">Недостаточно периодов.</p>`;
  const cfg  = DATA.dashboard_config || [];
  const curr = currentPeriod.periodId;
  const prev = prevPeriod.periodId;

  const metrics = [
    { label:"Rec. Score",     curr: currentPeriod.recScore || getConfig(cfg,curr,"recommendation_score"), prev: prevPeriod.recScore || getConfig(cfg,prev,"recommendation_score"), higherBetter:true },
    { label:"Всего ответов",  curr: currentPeriod.totalResponses || getConfig(cfg,curr,"total_responses"), prev: prevPeriod.totalResponses || getConfig(cfg,prev,"total_responses"), higherBetter:true },
  ].filter(m => m.curr && m.prev);

  const metricsHTML = metrics.map(m => {
    const d   = m.curr - m.prev;
    const cls = Math.abs(d) < 1 ? "delta-neu" : (m.higherBetter ? d >= 0 : d <= 0) ? "delta-pos" : "delta-neg";
    return `<div class="comp-card">
      <div class="comp-label">${m.label}</div>
      <div class="comp-values">
        <div><div class="comp-period">${prevPeriod.periodLabel}</div><div class="comp-num" style="color:var(--text-muted)">${m.prev}</div></div>
        <div class="comp-arrow">→</div>
        <div><div class="comp-period">${currentPeriod.periodLabel}</div><div class="comp-num">${m.curr}</div></div>
        <span class="comp-delta ${cls}">${d >= 0 ? "+" : ""}${d.toFixed(1)}</span>
      </div>
    </div>`;
  }).join("");

  const comparison = (DATA.comparison_prev_period || []).sort((a,b) => Math.abs(num(b.delta_pp)) - Math.abs(num(a.delta_pp)));
  const compRows = comparison.map(r => {
    const s   = getPrio(r.priority);
    const d   = num(r.delta_pp);
    const tCls = r.trend === "усилилось" ? "trend-up" : r.trend === "ослабло" ? "trend-down" : "trend-stable";
    const arr  = r.trend === "усилилось" ? "↑" : r.trend === "ослабло" ? "↓" : "→";
    return `<tr>
      <td style="font-weight:500">${r.theme}</td>
      <td><span class="tag" style="background:${s.bg};color:${s.text}">${r.priority}</span></td>
      <td style="font-family:var(--mono)">${r.previous_share}%</td>
      <td style="font-family:var(--mono)">${r.may_share}%</td>
      <td style="font-family:var(--mono);color:${d>0?"#2e7d32":d<0?"#d4380d":"#666"}">${d>0?"+":""}${d.toFixed(1)} pp</td>
      <td><span class="trend-badge ${tCls}">${arr} ${r.trend}</span></td>
    </tr>`;
  }).join("");

  return `
  <div class="page-header">
    <div class="header-badge badge-compare">Сравнение периодов</div>
    <div class="header-title">${currentPeriod.periodLabel} vs ${prevPeriod.periodLabel}</div>
  </div>
  <div class="section">
    <div class="section-title">Ключевые метрики</div>
    <div class="comp-grid">${metricsHTML}</div>
  </div>
  ${compRows ? `<div class="section">
    <div class="section-title">Динамика тем</div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Тема</th><th>Приоритет</th><th>${prevPeriod.periodLabel} %</th><th>${currentPeriod.periodLabel} %</th><th>Дельта</th><th>Тренд</th></tr></thead>
      <tbody>${compRows}</tbody>
    </table></div>
  </div>` : ""}`;
}

// ─── APP ──────────────────────────────────────────────────────────────────────
let STATE = { periods: [], activeTab: "current", DATA: {} };

function render() {
  const { periods, activeTab, DATA } = STATE;
  const current = periods[0];
  const past    = periods.slice(1);
  const prev    = past[0] || null;

  // Tabs
  const tabs = [
    { id:"current", label: current?.periodLabel || "Текущий" },
    ...past.map(p => ({ id:"past_"+p.periodId, label: p.periodLabel })),
    ...(periods.length >= 2 ? [{ id:"compare", label:"Сравнение" }] : []),
  ];
  document.getElementById("nav-tabs").innerHTML = tabs.map(t =>
    `<button class="nav-tab ${activeTab===t.id?"active":""}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join("");

  let html = "";
  if (activeTab === "current" && current)           html = renderPeriod(current, true, DATA);
  else if (activeTab.startsWith("past_")) {
    const pid = activeTab.replace("past_","");
    const p   = past.find(p => p.periodId === pid);
    if (p) html = renderPeriod(p, false, DATA);
  } else if (activeTab === "compare")               html = renderComparison(current, prev, DATA);

  document.getElementById("app").innerHTML = html;
}

window.switchTab = function(id) {
  STATE.activeTab = id;
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
};

(async () => {
  // Сначала показываем статичные данные — мгновенно
  STATE.DATA    = FALLBACK;
  STATE.periods = parsePeriods(FALLBACK.dashboard_config);
  document.getElementById("loading-screen").style.display = "none";
  render();

  // Затем пробуем загрузить живые данные из Google Sheets
  try {
    const live    = await fetchAll();
    // Обновляем только те листы, которые успешно загрузились
    const updated = Object.assign({}, FALLBACK);
    Object.entries(live).forEach(([k, v]) => { if (v && v.length > 0) updated[k] = v; });
    STATE.DATA    = updated;
    STATE.periods = parsePeriods(updated.dashboard_config);
    render(); // перерисовываем с живыми данными
  } catch(e) {
    console.warn("Live fetch failed, using static data:", e);
  }
})();
